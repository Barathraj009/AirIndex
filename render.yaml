services:
  - type: web
    name: airindex-backend
    runtime: docker
    plan: free
    dockerfilePath: deployment/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airindex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_SERVICE_JWT_SECRET
        sync: false
      - key: KIWI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://airindex-frontend.onrender.com
      - key: PYTHONPATH
        value: /app/backend:/app
      - key: INGESTION_SCHEDULE_CRON
        value: 0 6 * * *
      - key: FX_RATE_USD_INR
        value: 90.0
    healthCheckPath: /api/health

  - type: web
    name: airindex-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Email-OTP auth microservice (otp-service). Serves /api/auth/send-otp,
  # /verify-otp, /logout, /csrf; issues the hand-off JWT that the backend
  # verifies in /api/auth/register-with-otp.
  - type: web
    name: airindex-otp
    runtime: node
    rootDir: otp-service/backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://airindex-frontend.onrender.com
      - key: CSRF_ENABLED
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      # MUST be identical to the backend's OTP_SERVICE_JWT_SECRET — the
      # backend verifies this service's hand-off JWTs with the same value.
      - key: OTP_SERVICE_JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OTP_HASH_SECRET
        sync: false

databases:
  - name: airindex-db
    plan: free
    databaseName: airindex
    ipAllowList: []
