services:
  - type: web
    name: airindex-backend
    runtime: docker
    plan: free
    dockerfilePath: deployment/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airindex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: KIWI_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://airindex-frontend.onrender.com
      - key: PYTHONPATH
        value: /app/backend:/app
    healthCheckPath: /api/health

  - type: web
    name: airindex-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: airindex-db
    plan: free
    databaseName: airindex
    ipAllowList: []
