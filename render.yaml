services:
  - type: web
    name: airindex-otp
    runtime: node
    plan: free
    buildCommand: cd otp-service/backend && npm install
    startCommand: cd otp-service/backend && node server.js
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_TRANSPORT
        value: json
      - key: GMAIL_ONLY
        value: "true"
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: USE_COOKIE_SESSION
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
    healthCheckPath: /api/auth/health

  - type: web
    name: airindex-backend
    runtime: docker
    plan: free
    dockerfilePath: deployment/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airindex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_SERVICE_JWT_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app/backend
    healthCheckPath: /api/health

  - type: web
    name: airindex-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_OTP_SERVICE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: airindex-db
    plan: free
    databaseName: airindex
    ipAllowList: []
