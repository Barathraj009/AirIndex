name: ci

# Full cloud verification on GitHub-hosted runners:
#   backend  - alembic upgrade + zero-drift check, then the whole
#              75-test unittest suite against a real Postgres 16
#   frontend - npm ci, typecheck, production build
#   e2e      - real Chromium against the built SPA + live backend:
#              login smoke (8 checks) and route walk (13 routes clean)
# Plus `compose-verify.yml` exercises the real docker compose stack.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deployment/**"
      - "tests/**"
      - ".github/workflows/**"

env:
  POSTGRES_SCHEMA_USER: airindex
  POSTGRES_SCHEMA_PASS: airindex_dev_secret

jobs:
  backend:
    name: backend tests + alembic drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_SCHEMA_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_SCHEMA_PASS }}
          POSTGRES_DB: airindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airindex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Create dev-schema database (airindex)
        run: |
          python3 - <<'PY'
          import psycopg2
          conn = psycopg2.connect(host="localhost", user="airindex",
                                  password="airindex_dev_secret", dbname="postgres")
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute("SELECT 1 FROM pg_database WHERE datname = 'airindex'")
          if cur.fetchone():
              print("airindex already exists")
          else:
              cur.execute("CREATE DATABASE airindex")
              print("created airindex")
          conn.close()
          PY
      - name: Alembic upgrade head + zero-drift check (dev schema DB)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://airindex:airindex_dev_secret@localhost:5432/airindex
        run: |
          alembic upgrade head
          alembic check
      - name: Run full unit/integration suite against airindex_test
        env:
          PYTHONPATH: ".:./backend"
          JWT_SECRET_KEY: ci-not-for-production
        run: python -m unittest discover -s tests -q

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Production build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

  e2e-browser:
    name: browser smoke (login + full route walk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_SCHEMA_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_SCHEMA_PASS }}
          POSTGRES_DB: airindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airindex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL=http://127.0.0.1:8000/api npm run build
      - name: Prepare Postgres + seed backend data
        run: |
          python3 - <<'PY'
          import psycopg2
          conn = psycopg2.connect(host="localhost", user="airindex",
                                  password="airindex_dev_secret", dbname="postgres")
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute("SELECT 1 FROM pg_database WHERE datname = 'airindex'")
          if not cur.fetchone():
              cur.execute("CREATE DATABASE airindex")
              print("created airindex")
          conn.close()
          PY
      - name: Alembic migrate dev-schema DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://airindex:airindex_dev_secret@localhost:5432/airindex
        run: alembic upgrade head
      - name: Seed demo data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://airindex:airindex_dev_secret@localhost:5432/airindex
        run: python ../scripts/seed_database.py
      - name: Start backend (uvicorn) + production preview (vite)
        run: |
          cd "$GITHUB_WORKSPACE/backend"
          DATABASE_URL=postgresql+psycopg2://airindex:airindex_dev_secret@localhost:5432/airindex \
          ENVIRONMENT=development \
          JWT_SECRET_KEY=ci-not-for-production \
          CORS_ALLOWED_ORIGINS=http://localhost:4173,http://127.0.0.1:4173 \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          cd "$GITHUB_WORKSPACE/frontend"
          nohup npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null || { echo "backend failed"; cat /tmp/uvicorn.log; exit 1; }
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/login || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          curl -sf http://localhost:4173/login > /dev/null || { echo "preview failed"; cat /tmp/preview.log; exit 1; }
          echo "backend + preview up"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Login flow smoke (8 checks)
        run: python scripts/browser/login_smoke.py http://localhost:4173
      - name: Full route walk (13 pages)
        run: python scripts/browser/walk_pages.py http://localhost:4173
      - name: Always show server tails on failure
        if: failure()
        run: |
          echo "--- uvicorn ---"; tail -30 /tmp/uvicorn.log || true
          echo "--- preview ---"; tail -30 /tmp/preview.log || true